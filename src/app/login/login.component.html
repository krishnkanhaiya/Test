<div class="container-fluid bg-light vh-100 d-flex flex-column justify-content-center align-items-center">
  <div class="card text-center shadow-lg" style="width: 30rem;">
    <div class="card-header bg-primary text-white">
      <h1>Login</h1>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <p *ngIf="errorMessage" class="text-danger mt-3">{{ errorMessage }}</p>
      </form>
    </div>
  </div>
</div>
